# Aegis custom Grafana config
# Points provisioning at the project's grafana/provisioning/ directory
# so the Prometheus datasource and Aegis dashboard auto-load on startup.

[paths]
data     = C:\grafana\data
logs     = C:\grafana\logs
plugins  = C:\grafana\plugins
provisioning = g:\aegis-project\grafana\provisioning

[server]
http_port = 3001

[security]
admin_user     = admin
admin_password = admin

[log]
level = warn
