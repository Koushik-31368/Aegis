server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/aegis
    username: aegis
    password: aegis_dev
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update          # auto-creates/updates table schema on startup
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    com.aegis.cloud: INFO
    org.hibernate.SQL: WARN    # suppress noisy Hibernate SQL
