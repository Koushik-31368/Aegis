server:
  port: 8081

spring:
  datasource:
    # H2 in-memory DB for local verification (Postgres-compatible schema via JPA)
    # Replace with jdbc:postgresql://localhost:5433/aegis once Docker/native Postgres is available
    url: jdbc:h2:mem:aegis;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    username: aegis
    password: aegis_dev
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true       # accessible at http://localhost:8081/h2-console for manual queries
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create    # H2: recreate schema on each boot (vs update for real Postgres)
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.aegis.cloud: INFO
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: cloud-aggregator
