global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'edge-gateway'
    static_configs:
      # localhost when running Prometheus natively (Scoop); use host.docker.internal
      # in docker-compose for containerized Prometheus
      - targets: ['localhost:8080']
    metrics_path: '/actuator/prometheus'

  - job_name: 'cloud-aggregator'
    static_configs:
      - targets: ['localhost:8081']
    metrics_path: '/actuator/prometheus'
